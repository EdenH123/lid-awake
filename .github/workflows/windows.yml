# Builds and tests the Windows version of Lid Awake on a Windows machine at GitHub.
# Only for the Windows branch; turned off (gh workflow disable windows.yml) when not needed.
# The ready-made ZIP (job "package") is built on a manual run, or on a push whose commit message contains [package].
name: Windows
on:
  push:
    branches: [claude/windows-phase-2, "claude/windows-phase-3**"]
    paths: ["windows/**", "web/**", "assets/sky-*.jpg", "*.cmd", ".github/workflows/windows.yml"]
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build windows/LidAwake.Windows/LidAwake.Windows.csproj -c Release
      - name: Test
        if: hashFiles('windows/LidAwake.Windows.Tests/*.csproj') != ''
        # Detailed, so the output of passing tests shows too (the screen tests say what the runner has: "RUNNER: ...").
        run: dotnet test windows/LidAwake.Windows.Tests/LidAwake.Windows.Tests.csproj -c Release --logger "console;verbosity=detailed"
      - name: Publish the app for the installer test
        shell: powershell
        run: dotnet publish windows/LidAwake.Windows/LidAwake.Windows.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=false -o windows/app
      # Runs the real installer and uninstaller with Windows PowerShell 5.1, the one the
      # double-click launchers use. The switches (-SkipTailscale -NoStart -NoPause -KeepSettings
      # -DeleteSettings) are documented at the top of each script as "for automated tests".
      - name: Installer and uninstaller
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert([bool]$ok, [string]$what) {
            if ($ok) { Write-Host "PASS: $what" } else { Write-Host "FAIL: $what"; exit 1 }
          }
          function Invoke-Script([string]$script, [string[]]$flags) {
            Write-Host "---- $script $flags"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $script @flags | Out-Host
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: $script exited with $LASTEXITCODE"; exit 1 }
          }
          # The double-click launchers at the repo root, run the way a person's double-click does.
          # (From PowerShell, not "cmd /c": cmd drops the quotes around a name with parentheses.)
          function Invoke-Launcher([string]$name, [string[]]$flags) {
            Write-Host "---- $name $flags"
            & (Join-Path (Get-Location).Path $name) @flags | Out-Host
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: $name exited with $LASTEXITCODE"; exit 1 }
          }
          $installCmd = 'Install Lid Awake (Windows).cmd'
          $uninstallCmd = 'Uninstall Lid Awake (Windows).cmd'
          $dest = Join-Path $env:LOCALAPPDATA 'LidAwake'
          $exe = Join-Path $dest 'LidAwake.exe'
          $settingsDir = Join-Path $env:APPDATA 'LidAwake'
          $settingsFile = Join-Path $settingsDir 'settings.json'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          # A key the app never moves or rewrites (tailnetHost now moves to machine.json at start).
          $settingsText = '{"ciMarker":"untouched"}'
          $machineFile = Join-Path $dest 'machine.json'
          # What is left of the install folder besides machine.json (kept with the settings).
          function Get-LeftOver { @(Get-ChildItem -LiteralPath $dest -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'machine.json' }) }
          function Get-RunValue { (Get-ItemProperty -Path $runKey -Name 'LidAwake' -ErrorAction SilentlyContinue).LidAwake }
          # The per-user Start menu shortcut; its target is read back the way Windows resolves it.
          $startLink = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Lid Awake.lnk'
          function Get-LinkTarget { (New-Object -ComObject WScript.Shell).CreateShortcut($startLink).TargetPath }

          # The scripts must be plain ASCII, or Windows PowerShell 5.1 misreads them.
          foreach ($f in (Get-ChildItem -Path 'windows\*.ps1', '*.cmd')) {
            $bad = [IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }
            Assert (-not $bad) "$($f.Name) is plain ASCII"
          }

          # Settings that must survive installing and updating.
          New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
          [IO.File]::WriteAllText($settingsFile, $settingsText)

          Assert (Test-Path -LiteralPath 'windows\app\LidAwake.exe') 'the published app is in windows\app'

          # A launcher opened from a folder that is not the whole ZIP must explain and fail, not
          # flash and close. It reaches "pause", so give it an Enter key and a time limit.
          $guard = Join-Path $env:RUNNER_TEMP 'guard'
          New-Item -ItemType Directory -Path $guard -Force | Out-Null
          Copy-Item $installCmd $guard
          $enter = Join-Path $env:RUNNER_TEMP 'enter.txt'
          $guardOut = Join-Path $env:RUNNER_TEMP 'guard-out.txt'
          [IO.File]::WriteAllText($enter, "`r`n")
          $p = Start-Process -FilePath (Join-Path $guard $installCmd) -RedirectStandardInput $enter -RedirectStandardOutput $guardOut -PassThru -WindowStyle Hidden
          [void]$p.Handle  # Windows PowerShell 5.1 returns no ExitCode unless the handle is read
          $finished = $p.WaitForExit(60000)
          if (-not $finished) { $p.Kill() }
          Assert $finished 'the launcher in an empty folder did not hang'
          Assert ($p.ExitCode -ne 0) 'the launcher in an empty folder failed'
          Assert ([IO.File]::ReadAllText($guardOut) -match 'unpack the whole ZIP') 'the launcher in an empty folder says to unpack the ZIP'
          Assert (-not (Test-Path -LiteralPath $exe)) 'the guarded launcher installed nothing'

          Invoke-Launcher $installCmd @('-SkipTailscale', '-NoStart', '-NoPause')
          Assert (Test-Path -LiteralPath $exe) 'LidAwake.exe is installed in LOCALAPPDATA'
          Assert (Test-Path -LiteralPath (Join-Path $dest 'web')) 'the phone page files are installed'
          Assert ((Get-RunValue) -eq ('"' + $exe + '"')) 'the Run value points to the installed exe'
          Assert (Test-Path -LiteralPath $startLink) 'the Start menu shortcut "Lid Awake" exists'
          Assert ((Get-LinkTarget) -eq $exe) 'the Start menu shortcut points to the installed exe'
          Assert (Test-Path -LiteralPath 'windows\app') 'windows\app is still there'
          Assert ([IO.File]::ReadAllText($settingsFile) -eq $settingsText) 'settings untouched by the install'

          # The installed app itself starts and answers on 127.0.0.1:8787. It shows no window (only
          # a tray icon), which is fine here. Every wait has a time limit, so a hang cannot use up
          # the job; the app is stopped before anything is asserted.
          $app = Start-Process -FilePath $exe -WorkingDirectory $dest -PassThru
          [void]$app.Handle  # Windows PowerShell 5.1 returns no exit state unless the handle is read
          $authOk = $false
          $deadline = (Get-Date).AddSeconds(30)
          while (-not $authOk -and (Get-Date) -lt $deadline -and -not $app.HasExited) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8787/auth' -UseBasicParsing -TimeoutSec 5
              $j = $r.Content | ConvertFrom-Json
              $authOk = ($j.loopback -eq $true -and $j.os -eq 'windows')
            } catch { }
            if (-not $authOk) { Start-Sleep -Milliseconds 500 }
          }
          $pageStatus = 0
          $pageCsp = ''
          if ($authOk) {
            try {
              $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8787/' -UseBasicParsing -TimeoutSec 10
              $pageStatus = [int]$page.StatusCode
              $pageCsp = [string]$page.Headers['Content-Security-Policy']
            } catch { Write-Host "GET / failed: $($_.Exception.Message)" }
          }
          $wasRunning = -not $app.HasExited
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          $exited = $app.WaitForExit(15000)
          Assert $wasRunning 'the installed app kept running'
          Assert $authOk 'the installed app answers GET /auth with loopback true and os windows'
          Assert ($pageStatus -eq 200) "GET / answers 200 (got $pageStatus)"
          Assert ($pageCsp.Length -gt 0) 'GET / has a Content-Security-Policy header'
          Assert $exited 'the installed app stopped'
          Assert (-not (Get-Process -Name 'LidAwake' -ErrorAction SilentlyContinue)) 'no Lid Awake is left running'
          Assert ([IO.File]::ReadAllText($settingsFile) -eq $settingsText) 'settings untouched by starting the app'

          # Updating: a running Lid Awake (a stand-in process with that name) is stopped.
          $fake = Join-Path $env:RUNNER_TEMP 'fake\LidAwake.exe'
          New-Item -ItemType Directory -Path (Split-Path $fake) -Force | Out-Null
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $fake
          [void](Start-Process -FilePath $fake -ArgumentList '/c', 'ping -n 300 127.0.0.1 > nul' -WindowStyle Hidden)
          Start-Sleep -Seconds 2
          Assert ([bool](Get-Process -Name 'LidAwake' -ErrorAction SilentlyContinue)) 'a stand-in LidAwake process is running'
          Invoke-Script 'windows\install.ps1' @('-SkipTailscale', '-NoStart', '-NoPause')
          Assert (-not (Get-Process -Name 'LidAwake' -ErrorAction SilentlyContinue)) 'the update stopped the running app'
          Assert (Test-Path -LiteralPath $exe) 'LidAwake.exe is still installed after the update'
          Assert ((Get-RunValue) -eq ('"' + $exe + '"')) 'the Run value is still right after the update'
          Assert ((Get-LinkTarget) -eq $exe) 'the Start menu shortcut is still right after the update'
          Assert ([IO.File]::ReadAllText($settingsFile) -eq $settingsText) 'settings untouched by the update'

          # Uninstall, keeping settings (this PC's machine.json, if the app made one, among them).
          $machineExisted = Test-Path -LiteralPath $machineFile
          Invoke-Launcher $uninstallCmd @('-NoPause', '-KeepSettings')
          Assert ((Get-LeftOver).Count -eq 0) 'the app is gone from the install folder (only machine.json may stay)'
          Assert (-not (Test-Path -LiteralPath (Join-Path $dest 'LidAwake-access.log'))) 'the activity log is gone'
          if ($machineExisted) { Assert (Test-Path -LiteralPath $machineFile) 'machine.json (phone alerts) kept by -KeepSettings' }
          Assert ($null -eq (Get-RunValue)) 'the Run value is gone'
          Assert (-not (Test-Path -LiteralPath $startLink)) 'the Start menu shortcut is gone'
          Assert ([IO.File]::ReadAllText($settingsFile) -eq $settingsText) 'settings kept by -KeepSettings'

          # Uninstalling again when nothing is installed still works.
          Invoke-Script 'windows\uninstall.ps1' @('-NoPause', '-KeepSettings')

          # Install, then uninstall deleting settings too.
          Invoke-Script 'windows\install.ps1' @('-SkipTailscale', '-NoStart', '-NoPause')
          Assert (Test-Path -LiteralPath $exe) 'LidAwake.exe is installed again'
          Invoke-Script 'windows\uninstall.ps1' @('-NoPause', '-DeleteSettings')
          Assert (-not (Test-Path -LiteralPath $dest)) 'the install folder is gone, machine.json too (-DeleteSettings)'
          Assert ($null -eq (Get-RunValue)) 'the Run value is gone (second time)'
          Assert (-not (Test-Path -LiteralPath $startLink)) 'the Start menu shortcut is gone (second time)'
          Assert (-not (Test-Path -LiteralPath $settingsDir)) 'settings deleted by -DeleteSettings'

          # Saved lid values the uninstaller must treat with care. It runs here with no app
          # installed, only the saved values on disk; its output is read for what it told.
          function Invoke-UninstallCaptured([string[]]$flags) {
            Write-Host "---- windows\uninstall.ps1 $flags (captured)"
            $text = (& powershell -NoProfile -ExecutionPolicy Bypass -File 'windows\uninstall.ps1' @flags | Out-String)
            $code = $LASTEXITCODE
            Write-Host $text
            return [pscustomobject]@{ Code = $code; Text = $text }
          }
          $planGoneNote = '\[OK\] The power plan Lid Awake changed no longer exists; nothing to put back'
          $missingPlan = '00000000-1111-2222-3333-444444444444'

          # (a) Values saved for a power plan that does not exist: nothing is written, and the
          # values are cleared, in this PC's machine.json and in an older install's settings.json.
          & powercfg /list | Out-Null
          if ($LASTEXITCODE -eq 0) {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            [IO.File]::WriteAllText($machineFile, ('{"savedLidAc":1,"savedLidDc":2,"savedLidScheme":"' + $missingPlan + '"}'))
            $r = Invoke-UninstallCaptured @('-NoPause', '-KeepSettings')
            Assert ($r.Code -eq 0) 'uninstall succeeds when the saved power plan no longer exists'
            Assert ($r.Text -match $planGoneNote) 'uninstall says there is nothing to put back for a missing plan'
            Assert ((Get-LeftOver).Count -eq 0) 'only machine.json is left (missing plan)'
            Assert ([IO.File]::ReadAllText($machineFile) -match '"savedLidAc"\s*:\s*null') 'the saved lid values are cleared in machine.json'
            Remove-Item -LiteralPath $dest -Recurse -Force

            New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
            [IO.File]::WriteAllText($settingsFile, ('{"tailnetHost":"ci-test.ts.net","savedLidAc":1,"savedLidDc":2,"savedLidScheme":"' + $missingPlan + '"}'))
            $r = Invoke-UninstallCaptured @('-NoPause', '-KeepSettings')
            Assert ($r.Code -eq 0) 'uninstall succeeds for a missing plan saved in the old settings.json'
            Assert ($r.Text -match $planGoneNote) 'uninstall says there is nothing to put back (old settings.json)'
            $after = [IO.File]::ReadAllText($settingsFile)
            Assert ($after -match '"savedLidAc"\s*:\s*null') 'the saved lid values are cleared in settings.json'
            Assert ($after -match '"savedLidScheme"\s*:\s*null') 'the saved plan is cleared in settings.json'
            Assert ($after -match 'ci-test\.ts\.net') 'the rest of settings.json is untouched'
            Remove-Item -LiteralPath $settingsDir -Recurse -Force
          } else {
            Write-Host 'SKIP: powercfg /list does not work on this runner, so the missing-plan case is not run'
          }

          # (b) Values that are not a lid action cannot be put back: the app files go, but the
          # saved values stay in machine.json, and the exit code says it was not complete.
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $dest 'app-file.txt'), 'x')
          [IO.File]::WriteAllText($machineFile, '{"savedLidAc":9,"savedLidDc":2}')
          $r = Invoke-UninstallCaptured @('-NoPause', '-KeepSettings')
          Assert ($r.Code -ne 0) 'uninstall fails when the lid setting cannot be put back'
          Assert (Test-Path -LiteralPath $machineFile) 'machine.json is kept when the lid setting cannot be put back'
          Assert ([IO.File]::ReadAllText($machineFile) -match '"savedLidAc":9') 'machine.json still holds the saved values'
          Assert (-not (Test-Path -LiteralPath (Join-Path $dest 'app-file.txt'))) 'the other app files are removed anyway'
          Assert ($r.Text -match 'kept it in') 'uninstall says where it kept the lid setting'
          Remove-Item -LiteralPath $dest -Recurse -Force

          # (c) A brightness a crash left saved cannot be put back when there is no built-in
          # screen to set (this runner has none): machine.json stays, and the uninstaller says so.
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $dest 'app-file.txt'), 'x')
          [IO.File]::WriteAllText($machineFile, '{"savedBrightness":55}')
          $r = Invoke-UninstallCaptured @('-NoPause', '-KeepSettings')
          Assert ($r.Code -ne 0) 'uninstall fails when the saved brightness cannot be put back'
          Assert (Test-Path -LiteralPath $machineFile) 'machine.json is kept when the brightness cannot be put back'
          Assert ([IO.File]::ReadAllText($machineFile) -match '"savedBrightness":55') 'machine.json still holds the saved brightness'
          Assert ($r.Text -match 'screen brightness') 'uninstall says the screen brightness was not put back'
          Assert (-not (Test-Path -LiteralPath (Join-Path $dest 'app-file.txt'))) 'the other app files are removed anyway (brightness)'
          Remove-Item -LiteralPath $dest -Recurse -Force

          # (d) A saved brightness that is not 0 to 100 is never applied, and is kept.
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          [IO.File]::WriteAllText($machineFile, '{"savedBrightness":150}')
          $r = Invoke-UninstallCaptured @('-NoPause', '-KeepSettings')
          Assert ($r.Code -ne 0) 'uninstall fails for a saved brightness out of range'
          Assert ($r.Text -match 'looks wrong') 'uninstall says the saved brightness looks wrong'
          Assert ([IO.File]::ReadAllText($machineFile) -match '"savedBrightness":150') 'machine.json keeps the bad brightness'
          Remove-Item -LiteralPath $dest -Recurse -Force
          exit 0

  # Builds the ready-made ZIP for people whose PC has no .NET SDK. Run it by hand from the Actions
  # tab (Run workflow); download "LidAwake-Windows", unpack, and open "Install Lid Awake (Windows)".
  package:
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[package]')
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Publish the app
        shell: powershell
        run: dotnet publish windows/LidAwake.Windows/LidAwake.Windows.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=false -o windows/app
      # The ZIP is laid out like the repo: unpacked, the launchers at the top work as they are.
      - name: Lay out the ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'stage\windows' -Force | Out-Null
          Copy-Item 'windows\app' 'stage\windows\app' -Recurse
          Copy-Item 'windows\install.ps1', 'windows\uninstall.ps1' 'stage\windows'
          Copy-Item 'Install Lid Awake (Windows).cmd', 'Uninstall Lid Awake (Windows).cmd' 'stage'
          # Plain ASCII, one line per row (Set-Content writes CRLF on Windows), so Notepad shows it right.
          @(
            'LID AWAKE FOR WINDOWS - START HERE',
            '',
            '1) Unpack the whole ZIP (right-click it, Extract All).',
            '2) Double-click "Install Lid Awake (Windows)".',
            '3) If Windows shows "Windows protected your PC", click More info, then Run anyway.',
            '   If it asks "Do you want to run this file?", click Run.',
            '4) When it finishes, right-click the Lid Awake icon by the clock, choose',
            '   "Set phone password...", and then turn it on.',
            '',
            'To remove it later, double-click "Uninstall Lid Awake (Windows)".'
          ) | Set-Content -Path 'stage\README-FIRST.txt' -Encoding ASCII
          if (-not (Test-Path -LiteralPath 'stage\README-FIRST.txt')) { Write-Host 'README-FIRST.txt is missing from the ZIP'; exit 1 }
          if (-not (Test-Path -LiteralPath 'stage\windows\app\LidAwake.exe')) { Write-Host 'LidAwake.exe is missing from the ZIP'; exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: LidAwake-Windows
          path: stage
          retention-days: 3
          if-no-files-found: error
